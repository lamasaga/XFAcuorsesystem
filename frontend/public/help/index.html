<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>使用帮助 - 智能排课系统</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/help/help.css" />
</head>
<body>
  <header class="help-page-header">
    <h1>智能排课系统 · 使用帮助</h1>
    <p><a href="/">返回系统首页</a></p>
  </header>
  <main class="help-container">
    <div id="status" class="help-loading">正在加载指南…</div>
    <article id="content" class="help-doc" hidden></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    function prepareMarkdown(md) {
      return md
        .replace(/\[([^\]]+)\]\(\.\/[^)]+\.md\)/g, '$1')
        .replace(/^> \*\*适用对象\*\*：.*$/m, '')
        .replace(/^> \*\*最后更新\*\*：.*$/m, '')
        .replace(/^> \*\*说明\*\*：.*$/m, '')
    }

    async function load() {
      const status = document.getElementById('status')
      const content = document.getElementById('content')
      try {
        const res = await fetch('/guide.md', { cache: 'no-cache' })
        if (!res.ok) throw new Error('无法加载 guide.md (' + res.status + ')')
        const text = await res.text()
        if (typeof marked === 'undefined') throw new Error('Markdown 解析库未加载')
        marked.setOptions({ gfm: true, breaks: true })
        content.innerHTML = marked.parse(prepareMarkdown(text))
        status.hidden = true
        content.hidden = false
      } catch (e) {
        status.className = 'help-error'
        status.textContent = e.message || '加载失败'
      }
    }
    load()
  </script>
</body>
</html>
